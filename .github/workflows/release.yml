name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is stored.
# The pending publisher on PyPI is pinned to openpodhq/openpod + this filename,
# so renaming this file breaks publishing until PyPI is updated to match.
#
# To cut a release: bump `version` in pyproject.toml, commit, then publish a
# GitHub Release whose tag matches that version (v0.1.0 or 0.1.0).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install (core + dev only — tests run offline)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag/version mismatch would publish a version nobody asked for, and
      # PyPI never lets that filename be reused. Fail before the upload.
      - name: Verify release tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Release tag '$tag' does not match pyproject version '$proj'. Bump pyproject.toml or retag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openpod
    permissions:
      id-token: write  # required for Trusted Publishing; do not remove
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
