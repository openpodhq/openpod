[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpod"
version = "0.1.0"
description = "Local-first CLI + MCP server that turns long-form audio/video into personalized, cited, navigable briefings — everything runs on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenPod contributors" }]
keywords = ["podcast", "transcript", "mcp", "cli", "youtube", "ai-agent", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Text Processing",
]

# Core stays deliberately light: RSS parsing + YAML config. Everything that
# needs the network, heavy ML, or the agent surface is an optional extra so the
# library installs and runs (search, clip, deep-links) on the standard library.
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.1", "youtube-transcript-api>=0.6"]
asr = ["faster-whisper>=1.0"]
embeddings = ["numpy>=1.24"]
mcp = ["mcp>=1.2"]
# Optional player-sync bridge (push artifacts, pull heard/bookmarks). The HTTP
# client is stdlib urllib, so this extra installs nothing — it only makes the
# feature discoverable (`pip install 'openpod[sync]'`) and reserves the name.
sync = []
# Local player bridge (`openpod player-bridge`): lets an AI agent operate the
# browser player. Stdlib-only (http.server + SSE), so this installs nothing — it
# only makes the feature discoverable (`pip install 'openpod[bridge]'`).
bridge = []
# card.html always renders (stdlib-only); this only unlocks the best-effort
# 2x card.png raster. Never a hard dependency — see src/openpod/card.py.
card-png = ["playwright>=1.40"]
all = [
    "yt-dlp>=2024.1",
    "youtube-transcript-api>=0.6",
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "mcp>=1.2",
    "playwright>=1.40",
]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/openpodhq/openpod"
Repository = "https://github.com/openpodhq/openpod"

[project.scripts]
openpod = "openpod.cli:main"
openpod-mcp = "openpod.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openpod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
